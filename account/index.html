<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계정 관리·권한 체계 프로토타입 · BarisON</title>
<style>
:root{
  --bg:#F9FAFA; --surface:#FFFFFF; --surface-sub:#F9FAFB;
  --border:#E5E8EB; --border-strong:#D5D9DF; --border-input:#DCE0E5;
  --text:#17191C; --text-sub:#4E5968; --text-muted:#787E87; --text-placeholder:#AEB2B8;
  --primary:#338BFF; --primary-hover:#1B6FDE; --primary-weak:#EBF3FF;
  --danger:#F04452; --danger-weak:#FDECEE;
  --success:#12B76A;
  --chip:#F2F4F6; --thead:#F7F8FA;
  --radius-card:16px; --radius-input:8px; --radius-btn:8px;
  --shadow-card:0 1px 2px rgba(0,0,0,.04);
  --shadow-pop:0 6px 24px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px;color:var(--text)}
input:focus{outline:none}
::placeholder{color:var(--text-placeholder)}
a{color:var(--primary);text-decoration:none}

/* ---------- shell ---------- */
#app{min-height:100vh}
.shell{display:flex;min-height:100vh;min-width:1280px}
.sidebar{width:250px;flex:0 0 250px;background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.side-logo{height:90px;display:flex;align-items:center;padding:0 24px;font-size:24px;letter-spacing:-.6px;flex:0 0 auto}
.side-logo b{font-weight:800}
.side-logo i{font-style:italic;font-weight:500}
.side-body{flex:1 1 auto}
.side-foot{flex:0 0 auto;padding-bottom:16px}
.side-sec{padding:16px 24px 6px;font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.2px}
.side-item{display:block;width:100%;text-align:left;padding:12px 24px;font-size:14px;color:var(--text-sub);
  border-left:3px solid transparent}
.side-item:hover{background:var(--surface-sub)}
.side-item.on{background:var(--primary-weak);color:var(--primary);font-weight:600;border-left-color:var(--primary)}
.side-item.dim{color:var(--text-placeholder);cursor:default}
.side-item.dim:hover{background:none}

.body-col{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.topbar{height:90px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--surface);
  border-bottom:1px solid var(--border)}
.topbar .sel{height:38px;min-width:220px;border:1px solid var(--border-input);border-radius:var(--radius-input);
  display:flex;align-items:center;padding:0 12px;color:var(--text-sub);font-size:14px;background:var(--surface)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.badge{height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;color:#fff}
.badge.super{background:#F0483E}
.badge.owner{background:#5B6472}
.topbar .who{font-size:14px;color:var(--text-sub)}
.topbar .app-btn{height:38px;padding:0 14px;border:1px solid var(--primary);color:var(--primary);border-radius:var(--radius-btn);font-size:14px}
.main{flex:1 1 auto;padding:40px 24px 24px}
.footer{flex:0 0 auto;height:60px;display:flex;align-items:center;padding:0 24px;color:var(--text-muted);font-size:13px;background:var(--surface-sub)}
.page-title{font-size:24px;font-weight:600;margin-bottom:24px;display:flex;align-items:center;gap:14px}
.page-title .tab{font-size:24px;font-weight:600;color:var(--text-placeholder);cursor:pointer}
.page-title .tab.on{color:var(--text)}
.card{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:40px;max-width:1142px}
.card.narrow{max-width:544px;padding:32px}

/* ---------- filter bar / table ---------- */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:20px;height:38px}
.seg{display:flex;background:var(--chip);border-radius:var(--radius-btn);padding:3px;height:38px}
.seg button{padding:0 14px;border-radius:6px;font-size:14px;color:var(--text-sub)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sel-input{height:38px;border:1px solid var(--border-input);border-radius:var(--radius-input);padding:0 10px;
  background:var(--surface);color:var(--text-sub);min-width:120px}
.search{margin-left:auto;position:relative}
.search input{height:38px;width:260px;border:1px solid var(--border-input);border-radius:var(--radius-input);padding:0 12px}
.count{font-size:14px;color:var(--text-muted);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:var(--thead);color:var(--text-sub);font-weight:600;text-align:left;padding:12px 14px;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:14px;border-bottom:1px solid var(--border);color:var(--text-sub);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-sub)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600}
.pill.on{background:#E7F7EF;color:#0F9D58}
.pill.off{background:var(--chip);color:var(--text-muted)}
.pill.wait{background:var(--primary-weak);color:var(--primary)}
.empty{padding:60px 0;text-align:center;color:var(--text-muted)}

/* ---------- form ---------- */
.body-title{font-size:18px;font-weight:600;margin:0 0 16px}
.body-title + .body-title,.group + .body-title{margin-top:32px}
.group{display:flex;flex-direction:column;gap:16px}
.field{max-width:480px}
.field.wide{max-width:660px}
.label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.label .req{color:var(--danger);margin-left:2px}
.input{width:100%;height:36px;border:1px solid var(--border-input);border-radius:var(--radius-input);padding:0 12px;background:var(--surface)}
.input:disabled{background:var(--surface-sub);color:var(--text-muted)}
.input.err{border-color:var(--danger)}
.help{font-size:12px;color:var(--text-muted);margin-top:6px}
.help.err{color:var(--danger)}
.row-inline{display:flex;gap:8px;align-items:center;max-width:660px}
.row-inline .input{max-width:480px}
.radios{display:flex;gap:20px;align-items:center;height:24px}
.radio{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--text-sub)}
.radio input{accent-color:var(--primary);width:16px;height:16px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:32px}
.btn{height:48px;padding:0 20px;border-radius:var(--radius-btn);font-size:15px;font-weight:600}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--chip);color:var(--text-sub)}
.btn.danger{background:var(--danger-weak);color:var(--danger)}
.btn.m{height:38px;padding:0 14px;font-size:14px;font-weight:500}
.btn.weak{background:var(--primary-weak);color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* branch multiselect */
.branch-box{position:relative;max-width:480px}
.branch-input{min-height:36px;border:1px solid var(--border-input);border-radius:var(--radius-input);
  padding:4px 30px 4px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);cursor:pointer}
.branch-input.err{border-color:var(--danger)}
.branch-input .ph{color:var(--text-placeholder);padding-left:4px}
.branch-input:after{content:"";position:absolute;right:12px;top:15px;width:7px;height:7px;
  border-right:1.5px solid var(--text-muted);border-bottom:1.5px solid var(--text-muted);transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;background:var(--chip);border-radius:6px;font-size:13px}
.chip button{color:var(--text-muted);font-size:14px;line-height:1}
.branch-pop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-input);box-shadow:var(--shadow-pop);max-height:230px;overflow-y:auto;z-index:20}
.branch-pop div{padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.branch-pop div:hover{background:var(--surface-sub)}
.branch-pop div.sel{color:var(--primary);font-weight:600}
.branch-cap{font-size:12px;margin-top:6px;color:var(--text-sub)}
.branch-cap b{color:var(--primary);font-weight:600}

/* ---------- auth screens ---------- */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0;gap:14px}
.auth .card{width:544px;max-width:544px;padding:32px}
.auth-logo{text-align:center;font-size:24px;letter-spacing:-.6px;margin-bottom:8px}
.auth-logo b{font-weight:800}
.auth-logo i{font-style:italic;font-weight:500}
.auth-sub{text-align:center;font-size:14px;color:var(--text-muted);margin-bottom:24px;white-space:pre-line}
.auth .field{max-width:480px;margin:0 auto}
.auth .group .field{margin:0;width:100%;max-width:none}
.auth .btn{width:100%;max-width:480px;display:block;margin:20px auto 0}
.auth-foot{text-align:center;font-size:13px;color:var(--text-muted);margin-top:14px}
.auth-msg{max-width:480px;margin:14px auto 0;padding:10px 12px;border-radius:var(--radius-input);font-size:13px}
.auth-msg.err{background:var(--danger-weak);color:var(--danger)}
.auth-msg.wait{background:var(--primary-weak);color:var(--primary)}
.done{text-align:center;padding:20px 0}
.done h3{font-size:20px;font-weight:600;margin-bottom:10px}
.done p{color:var(--text-muted);margin-bottom:24px}
.demo-note{width:544px;font-size:12px;color:var(--text-muted);background:#fff;border:1px dashed var(--border-strong);
  border-radius:10px;padding:12px 14px;line-height:1.7}
.demo-note b{color:var(--text-sub)}

/* ---------- toast / dialog ---------- */
.toast{position:fixed;top:150px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;
  padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow-pop)}
.toast.err{background:var(--danger)}
.dim-layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.dialog{width:424px;background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-pop);
  padding:24px;text-align:center}
.dialog h4{font-size:18px;font-weight:600;margin-bottom:8px}
.dialog p{font-size:14px;color:var(--text-muted);margin-bottom:20px;word-break:break-all}
.dialog .pw{font-size:20px;font-weight:700;color:var(--text);letter-spacing:1px;display:block;margin-bottom:6px}
.dialog .btns{display:flex;gap:8px}
.dialog .btns .btn{flex:1;height:48px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   BarisON 계정관리 프로토타입 — 감축 확정안(2026-09-07) 반영
   · 메일 자동 발송 없음 · 계정 삭제 없음 · 오픈 예정 직접 입력 없음
   · 신청/반려 사유 없음 · 지점 필터·마지막 접속일 없음
   ============================================================ */

const BRANCHES = [
  {code:"BB001", name:"서울시청"},
  {code:"BB005", name:"시대인재 1호점"},
  {code:"BB006", name:"시대인재 2호점"},
  {code:"BB007", name:"시대인재 3호점"},
  {code:"BB008", name:"시대인재 4호점"},
  {code:"BB009", name:"시대인재 5호점"},
  {code:"BB016", name:"서울갤러리"},
  {code:null, name:"성수"},
  {code:null, name:"강남대로점"},
  {code:null, name:"현대자동차점"},
  {code:null, name:"덕구온천호텔앤콘도"},
  {code:null, name:"라운지와이"},
  {code:null, name:"라운지엑스 판교점"},
  {code:null, name:"호반써밋 2차"},
  {code:null, name:"용산더프라임점"},
];
const bLabel = n => { const b = BRANCHES.find(x=>x.name===n); return b && b.code ? b.code+" "+b.name : n; };

const MENUS = [
  {sec:"", items:[{k:"home", n:"홈", hq:true}]},
  {sec:"로봇관리", items:[{k:"ops", n:"운영관리"},{k:"device", n:"기기상태관리"}]},
  {sec:"매장관리", items:[{k:"stock", n:"재고관리"},{k:"product", n:"판매상품관리"},{k:"kiosk", n:"키오스크설정"},{k:"did", n:"DID관리"},{k:"pay", n:"결제관리"}]},
  {sec:"매출관리/분석", items:[{k:"cal", n:"매출달력"},{k:"sales", n:"매출분석"},{k:"biz", n:"영업분석"},{k:"item", n:"상품분석"}]},
  {sec:"설정", items:[{k:"account", n:"계정관리", hq:true}]},
];

let seq = 100;
const state = {
  view: "login",
  session: null,
  loginMsg: null,
  accounts: [
    {id:"hqops", name:"로봇운영관리팀", email:"hqops@example.com", tel:"010-1000-0001", role:"hq", all:true, branches:[], status:"active", created:"2025-03-04", pw:"baris1234!", temp:false},
    {id:"hqretail", name:"리테일팀", email:"hqretail@example.com", tel:"010-1000-0002", role:"hq", all:true, branches:[], status:"active", created:"2025-03-04", pw:"baris1234!", temp:false},
    {id:"hqexec", name:"경영자", email:"hqexec@example.com", tel:"010-1000-0003", role:"hq", all:true, branches:[], status:"active", created:"2025-03-04", pw:"baris1234!", temp:false},
    {id:"hqstaff1", name:"유OO", email:"hqstaff1@example.com", tel:"010-1000-0004", role:"hq", all:false, branches:["서울시청","서울갤러리"], status:"active", created:"2025-04-18", pw:"baris1234!", temp:false},
    {id:"hqstaff2", name:"홍OO", email:"hqstaff2@example.com", tel:"010-1000-0005", role:"hq", all:false, branches:["성수","강남대로점"], status:"inactive", created:"2025-04-18", pw:"baris1234!", temp:false},
    {id:"store01", name:"서울갤러리", email:"store01@example.com", tel:"010-2000-0001", role:"owner", all:false, branches:["서울갤러리"], status:"active", created:"2025-11-20", pw:"baris1234!", temp:false},
    {id:"store02", name:"시대인재", email:"store02@example.com", tel:"010-2345-6789", role:"owner", all:false, branches:["시대인재 1호점","시대인재 2호점","시대인재 3호점","시대인재 4호점","시대인재 5호점"], status:"active", created:"2025-06-11", pw:"baris1234!", temp:false},
    {id:"store03", name:"현대자동차", email:"store03@example.com", tel:"010-2000-0003", role:"owner", all:false, branches:["현대자동차점"], status:"active", created:"2025-02-07", pw:"baris1234!", temp:false},
    {id:"store04", name:"덕구온천호텔앤콘도", email:"store04@example.com", tel:"010-2000-0004", role:"owner", all:false, branches:["덕구온천호텔앤콘도"], status:"active", created:"2025-08-22", pw:"baris1234!", temp:false},
    {id:"store05", name:"라운지와이", email:"store05@example.com", tel:"010-2000-0005", role:"owner", all:false, branches:["라운지와이"], status:"inactive", created:"2026-01-09", pw:"baris1234!", temp:false},
  ],
  requests: [
    {rid:1, date:"2026-08-17", id:"newshop01", name:"김OO", email:"newshop01@example.com", tel:"010-1234-5678", store:"라운지엑스 판교점", pw:"baris1234!"},
    {rid:2, date:"2026-08-16", id:"bx007", name:"이OO", email:"bx007@example.com", tel:"010-2345-6789", store:"호반써밋 2차", pw:"baris1234!"},
    {rid:3, date:"2026-08-14", id:"cafeyj", name:"박OO", email:"cafeyj@example.com", tel:"010-3456-7890", store:"용산더프라임점", pw:"baris1234!"},
  ],
  tab: "list",
  filter: {role:"all", status:"all", q:""},
  form: {},
  errors: {},
  editing: null,
  branchOpen: false,
  storeOpen: false,
  toast: null,
  dialog: null,
};

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const roleName = r => r==="hq" ? "본사 관리자" : "매장 점주";
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const genPw = () => { const s="abcdefghjkmnpqrstuvwxyz23456789"; let o=""; for(let i=0;i<8;i++) o+=s[Math.floor(Math.random()*s.length)]; return o; };
const toast = (msg, kind) => { state.toast = {msg, kind:kind||""}; render(); setTimeout(()=>{ state.toast=null; render(); }, 2600); };
const acct = id => state.accounts.find(a=>a.id===id);
const lastHq = a => a.role==="hq" && a.status==="active" && state.accounts.filter(x=>x.role==="hq"&&x.status==="active").length<=1;

function branchText(a){
  if (a.all) return "전 지점";
  if (!a.branches.length) return "-";
  if (a.branches.length<=2) return a.branches.join(", ");
  return a.branches[0]+" +"+(a.branches.length-1);
}

/* ---------- validation ---------- */
function validateAccount(f, opts){
  const e = {};
  const o = opts||{};
  // 아이디 형식은 새로 발급하는 계정에만 적용한다 — 기존 계정에는 대문자가 섞인 값이 있고 그대로 둔다
  if (!f.id) e.id = "아이디를 입력해주세요.";
  else if (!o.skipFormat && !/^[a-z0-9]{4,20}$/.test(f.id)) e.id = "영문 소문자·숫자 4~20자로 입력해주세요.";
  else if (!o.skipDup && (acct(f.id) || state.requests.some(r=>r.id===f.id))) e.id = "이미 쓰이고 있는 아이디입니다.";
  if (!f.name) e.name = "이름을 입력해주세요.";
  if (!f.email) e.email = "이메일을 입력해주세요.";
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email = "이메일 형식이 올바르지 않습니다.";
  else if (state.accounts.some(a=>a.email===f.email && a.id!==o.self)) e.email = "이미 쓰이고 있는 이메일입니다.";
  if (!f.tel) e.tel = "연락처를 입력해주세요.";
  if (!f.role) e.role = "역할을 선택해주세요.";
  if (f.role==="owner" && !(f.branches||[]).length) e.branches = "관리지점을 선택해주세요.";
  if (f.role==="hq" && !f.all && !(f.branches||[]).length) e.branches = "지정 지점을 선택하거나 전 지점으로 두세요.";
  return e;
}
function validatePw(pw, pw2, id){
  if (!pw) return "새 비밀번호를 입력해주세요.";
  if (pw.length<8) return "8자 이상으로 입력해주세요.";
  const kinds = [/[a-zA-Z]/, /[0-9]/, /[^a-zA-Z0-9]/].filter(re=>re.test(pw)).length;
  if (kinds<2) return "영문·숫자·특수문자 중 2가지 이상을 섞어주세요.";
  if (id && pw===id) return "아이디와 같은 값은 쓸 수 없습니다.";
  return null;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app = document.getElementById("app");
  let html = "";
  if (["login","signup","signupDone","firstPw"].includes(state.view)) html = renderAuth();
  else html = renderShell();
  if (state.toast) html += `<div class="toast ${state.toast.kind}">${esc(state.toast.msg)}</div>`;
  if (state.dialog) html += renderDialog();
  app.innerHTML = html;
}

/* ---------- auth ---------- */

function fieldHtml(label, key, val, err, ph, opts){
  const o = opts||{};
  return `<div class="field ${o.wide?"wide":""}">
    <div class="label">${esc(label)}${o.optional?"":'<span class="req">*</span>'}</div>
    <input class="input ${err?"err":""}" data-field="${key}" value="${esc(val||"")}" placeholder="${esc(ph||"")}" ${o.disabled?"disabled":""}>
    ${err?`<div class="help err">${esc(err)}</div>`:(o.help?`<div class="help">${esc(o.help)}</div>`:"")}
  </div>`;
}

/* ---------- shell ---------- */
function renderShell(){
  const s = state.session;
  const isHq = s.role==="hq";
  let side = "";
  for (const grp of MENUS){
    const items = grp.items.filter(it=>!it.hq || isHq);
    if (!items.length) continue;
    if (grp.sec) side += `<div class="side-sec">${esc(grp.sec)}</div>`;
    side += items.map(it=>{
      const on = (it.k==="account" && ["list","pending","add","detail","pendingDetail"].includes(state.view));
      const act = it.k==="account" ? ` data-action="go-list"` : ` `;
      return `<button class="side-item ${on?"on":""} ${it.k==="account"?"":"dim"}"${act}>${esc(it.n)}</button>`;
    }).join("");
  }
  return `
  <div class="shell">
    <aside class="sidebar">
      <div class="side-logo"><b>Baris</b><i>brew</i></div>
      <div class="side-body">${side}</div>
    </aside>
    <div class="body-col">
      <header class="topbar">
        <div class="sel">지점명</div>
        <div class="right">
          <span class="badge ${isHq?"super":"owner"}">${isHq?"Super Admin":"Owner"}</span>
          <span class="who">${esc(s.name)}님 반가워요</span>
          <button class="app-btn" data-action="go-me">내 정보</button>
          <button class="app-btn" data-action="logout">로그아웃</button>
        </div>
      </header>
      <main class="main">${renderMain()}</main>
      <footer class="footer">2026 © XYZ corp.</footer>
    </div>
  </div>`;
}

function renderMain(){
  switch(state.view){
    case "list": return viewList();
    case "pending": return viewPending();
    case "add": return viewAdd();
    case "detail": return viewDetail();
    case "pendingDetail": return viewPendingDetail();
    case "me": return viewMe();
    case "mePw": return viewMePw();
    case "blocked": return `<div class="card"><div class="empty">이 프로토타입은 계정관리 화면만 다룹니다.<br>매장 점주 계정에는 계정관리 메뉴가 보이지 않습니다 — 우상단 「내 정보」로 확인해보세요.</div></div>`;
  }
  return "";
}

/* ---------- list ---------- */
function viewList(){
  const f = state.filter;
  let rows = state.accounts.filter(a=>{
    if (f.role!=="all" && a.role!==f.role) return false;
    if (f.status!=="all" && a.status!==f.status) return false;
    if (f.q){ const q=f.q.toLowerCase();
      if (!(a.id.toLowerCase().includes(q) || a.name.toLowerCase().includes(q) || a.email.toLowerCase().includes(q))) return false; }
    return true;
  });
  return `
  <div class="page-title">
    <span class="tab on">계정 목록</span>
    <span class="tab" data-action="go-pending">승인 대기${state.requests.length?` (${state.requests.length})`:""}</span>
    <button class="btn m primary" style="margin-left:auto" data-action="go-add">계정 추가</button>
  </div>
  <div class="card">
    <div class="filter-bar">
      <div class="seg">
        <button class="${f.role==="all"?"on":""}" data-action="f-role" data-v="all">전체</button>
        <button class="${f.role==="hq"?"on":""}" data-action="f-role" data-v="hq">본사 관리자</button>
        <button class="${f.role==="owner"?"on":""}" data-action="f-role" data-v="owner">매장 점주</button>
      </div>
      <select class="sel-input" data-field="fstatus">
        <option value="all" ${f.status==="all"?"selected":""}>상태 전체</option>
        <option value="active" ${f.status==="active"?"selected":""}>활성</option>
        <option value="inactive" ${f.status==="inactive"?"selected":""}>비활성</option>
      </select>
      <div class="search"><input data-field="fq" value="${esc(f.q)}" placeholder="아이디 · 이름 · 이메일 검색"></div>
    </div>
    <div class="count">총 ${rows.length}개</div>
    <table>
      <thead><tr><th>아이디</th><th>이름</th><th>이메일</th><th>역할</th><th>관리지점</th><th>상태</th><th>등록일</th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(a=>`
          <tr data-action="open-detail" data-id="${esc(a.id)}">
            <td>${esc(a.id)}</td><td>${esc(a.name)}</td><td>${esc(a.email)}</td>
            <td>${roleName(a.role)}</td><td>${esc(branchText(a))}</td>

/* ---------- branch multiselect ---------- */
function branchField(f, err){
  const sel = f.branches||[];
  const shown = sel.slice(0,2);
  return `
  <div class="field">
    <div class="label">관리지점${f.role==="owner"?'<span class="req">*</span>':""}</div>
    <div class="branch-box" data-stop="1">
      <div class="branch-input ${err?"err":""}" data-action="toggle-branch">
        ${shown.length ? shown.map(n=>`<span class="chip">${esc(bLabel(n))}<button data-action="rm-branch" data-v="${esc(n)}">×</button></span>`).join("")
                       : `<span class="ph">지점을 선택해주세요</span>`}
      </div>
      ${state.branchOpen ? `<div class="branch-pop">
        ${BRANCHES.map(b=>`<div class="${sel.includes(b.name)?"sel":""}" data-action="pick-branch" data-v="${esc(b.name)}">
          <span>${sel.includes(b.name)?"✓":"&nbsp;&nbsp;"}</span>${esc(b.code?b.code+" "+b.name:b.name)}</div>`).join("")}
      </div>` : ""}
    </div>
    ${err?`<div class="help err">${esc(err)}</div>`
        : (sel.length ? `<div class="branch-cap"><b>선택됨</b> — ${esc(sel.map(bLabel).join(", "))}</div>` : "")}
  </div>`;
}

    <div class="group">
      <div class="field"><div class="label">현재 비밀번호<span class="req">*</span></div>
        <input class="input ${e.cur?"err":""}" type="password" data-field="cur" value="${esc(f.cur||"")}" placeholder="현재 쓰는 비밀번호">
        ${e.cur?`<div class="help err">${esc(e.cur)}</div>`:""}</div>
      <div class="field"><div class="label">새 비밀번호<span class="req">*</span></div>
        <input class="input ${e.pw?"err":""}" type="password" data-field="pw" value="${esc(f.pw||"")}" placeholder="8자 이상, 영문·숫자·특수문자 중 2가지">
        ${e.pw?`<div class="help err">${esc(e.pw)}</div>`:""}</div>
      <div class="field"><div class="label">새 비밀번호 확인<span class="req">*</span></div>
        <input class="input ${e.pw2?"err":""}" type="password" data-field="pw2" value="${esc(f.pw2||"")}" placeholder="한 번 더 입력">
        ${e.pw2?`<div class="help err">${esc(e.pw2)}</div>`:""}</div>
    </div>
    <div class="actions">
      <button class="btn ghost" data-action="go-me">취소</button>
      <button class="btn primary" data-action="save-mepw">저장하기</button>
    </div>
  </div>`;
}

/* ---------- dialog ---------- */
function renderDialog(){
  const d = state.dialog;
  if (d.kind==="temppw") return `
  <div class="dim-layer">
    <div class="dialog">
      <h4>임시 비밀번호가 발급되었어요</h4>
      <p><span class="pw">${esc(d.pw)}</span>창을 닫으면 다시 볼 수 없어요</p>
      <div class="btns">
        <button class="btn weak" data-action="copy-pw" data-v="${esc(d.pw)}">복사</button>
        <button class="btn primary" data-action="dialog-ok">확인</button>
      </div>
    </div>
  </div>`;
  return "";
}

/* ============================================================
   EVENTS
   ============================================================ */
const app = document.getElementById("app");

app.addEventListener("input", ev=>{
  const el = ev.target.closest("[data-field]");
  if (!el) return;
  const k = el.dataset.field;
  if (k==="fq"){ state.filter.q = el.value; renderListBodyOnly(); return; }
  state.form[k] = el.value;
});

app.addEventListener("change", ev=>{
  const el = ev.target.closest("[data-field]");
  if (el && el.dataset.field==="fstatus"){ state.filter.status = el.value; render(); return; }
  if (el && el.dataset.field==="store"){ state.form.store = el.value; return; }
});

app.addEventListener("click", ev=>{
  const t = ev.target.closest("[data-action]");
  if (t && t.tagName === "A") ev.preventDefault();
  if (!t){
    if ((state.branchOpen || state.storeOpen) && !ev.target.closest("[data-stop]")){
      state.branchOpen=false; state.storeOpen=false; render(); }
    return;
  }
  const a = t.dataset.action, v = t.dataset.v;
  const stopOutside = ev.target.closest("[data-stop]");
  if (state.branchOpen && !stopOutside && !["toggle-branch","pick-branch","rm-branch"].includes(a)) state.branchOpen=false;
  if (state.storeOpen && !stopOutside && !["toggle-store","pick-store"].includes(a)) state.storeOpen=false;

  switch(a){
    /* auth */
    case "login": doLogin(); break;
    case "go-signup": state.view="signup"; state.form={}; state.errors={}; render(); break;
    case "go-login": state.view="login"; state.form={}; state.errors={}; state.loginMsg=null; render(); break;
    case "signup-submit": doSignup(); break;
    case "first-pw-save": doFirstPw(); break;
    case "logout": state.session=null; state.view="login"; state.form={}; state.loginMsg=null; render(); break;

    /* nav */
    case "go-list": state.view="list"; state.errors={}; state.branchOpen=false; render(); break;
    case "go-pending": state.view="pending"; render(); break;
    case "go-add": state.view="add"; state.form={role:"", all:true, branches:[]}; state.errors={}; render(); break;
    case "go-me": openMe(); break;
    case "go-mepw": state.view="mePw"; state.form={}; state.errors={}; render(); break;

    /* list */
    case "f-role": state.filter.role=v; render(); break;
    case "open-detail": openDetail(t.dataset.id); break;
    case "open-request": openRequest(Number(t.dataset.id)); break;

    /* form widgets */
    case "pick-role": state.form.role=v; if(v==="owner") state.form.all=false; state.errors={}; render(); break;
    case "pick-scope": state.form.all = (v==="all"); if(state.form.all) state.form.branches=[]; render(); break;
    case "pick-status": state.form.status=v; render(); break;
    case "toggle-branch": state.branchOpen=!state.branchOpen; render(); break;
    case "toggle-store": state.storeOpen=!state.storeOpen; render(); break;
    case "pick-store": state.form.store=v; state.storeOpen=false; render(); break;
    case "pick-branch": {
      const list = state.form.branches||[];
      state.form.branches = list.includes(v) ? list.filter(x=>x!==v) : list.concat([v]);
      render(); break; }
    case "rm-branch": ev.stopPropagation();
      state.form.branches = (state.form.branches||[]).filter(x=>x!==v); render(); break;

    /* save */
    case "save-add": doAdd(); break;
    case "save-detail": doSaveDetail(); break;
    case "reset-pw": doResetPw(); break;
    case "approve": doApprove(); break;
    case "reject": doReject(); break;
    case "save-me": doSaveMe(); break;
    case "save-mepw": doSaveMePw(); break;

    /* dialog */
    case "copy-pw":
      if (navigator.clipboard) navigator.clipboard.writeText(v).catch(()=>{});
      toast("임시 비밀번호를 복사했습니다."); break;
    case "dialog-ok": {
      const d = state.dialog; state.dialog=null;
      if (d.after==="list"){ state.view="list"; state.form={}; toast(d.msg||"계정이 생성되었습니다."); }
      else render();
      break; }
  }
});

function renderListBodyOnly(){
  // 검색은 포커스를 지키려고 표만 다시 그린다
  const wrap = document.querySelector(".card table");
  if (!wrap) { render(); return; }
  const tmp = document.createElement("div");
  tmp.innerHTML = viewList();
  const nt = tmp.querySelector("table"), nc = tmp.querySelector(".count");
  if (nt) wrap.innerHTML = nt.innerHTML;
  const cnt = document.querySelector(".card .count");
  if (cnt && nc) cnt.textContent = nc.textContent;
}

/* ---------- actions ---------- */
function doLogin(){
  const id = (state.form.loginId||"").trim(), pw = state.form.loginPw||"";
  state.loginMsg = null;
  const req = state.requests.find(r=>r.id===id);
  if (req && req.pw===pw){ state.loginMsg={kind:"wait", text:"승인 대기 중인 계정입니다. 본사 확인 후 이용할 수 있습니다."}; render(); return; }
  const a = acct(id);
  if (!a || a.pw!==pw){ state.loginMsg={kind:"err", text:"아이디 또는 비밀번호가 올바르지 않습니다."}; render(); return; }
  if (a.status==="inactive"){ state.loginMsg={kind:"err", text:"사용이 중지된 계정입니다. 본사 관리자에게 문의하세요."}; render(); return; }
  state.session = a;
  if (a.temp){ state.view="firstPw"; state.form={}; state.errors={}; render(); return; }
  enterHome();
}
function enterHome(){
  state.form={}; state.errors={};
  state.view = state.session.role==="hq" ? "list" : "blocked";
  render();
}
function doSignup(){
  const f = state.form, e = validateAccount({...f, role:"owner", branches:["-"]}, {});
  delete e.role; delete e.branches;
  if (!f.store) e.store = "매장을 선택해주세요.";
  state.errors = e;
  if (Object.keys(e).length){ render(); return; }
  state.requests.unshift({rid:++seq, date:today(), id:f.id, name:f.name, email:f.email, tel:f.tel, store:f.store, pw:"baris1234!"});
  state.view="signupDone"; state.form={}; render();
}
function doFirstPw(){
  const f = state.form, e = {};
  const msg = validatePw(f.pw, f.pw2, state.session.id);
  if (msg) e.pw = msg;
  else if (f.pw!==f.pw2) e.pw2 = "두 값이 다릅니다.";
  state.errors = e;
  if (Object.keys(e).length){ render(); return; }
  state.session.pw = f.pw; state.session.temp = false;
  enterHome(); toast("비밀번호를 변경했습니다.");
}
function doAdd(){
  const f = state.form;
  const e = validateAccount(f, {});
  state.errors = e;
  if (Object.keys(e).length){ render(); return; }
  const pw = genPw();
  state.accounts.unshift({
    id:f.id, name:f.name, email:f.email, tel:f.tel, role:f.role,
    all: f.role==="hq" ? !!f.all : false,
    branches: (f.role==="hq" && f.all) ? [] : (f.branches||[]),
    status:"active", created:today(), pw, temp:true,
  });
  state.dialog = {kind:"temppw", pw, after:"list", msg:"계정이 생성되었습니다."};
  render();
}
function openDetail(id){
  const a = acct(id); if (!a) return;
  state.editing = id;
  state.form = {...a, branches:[...a.branches]};
  state.errors={}; state.branchOpen=false; state.view="detail"; render();
}
function doSaveDetail(){
  const f = state.form;
  const e = validateAccount(f, {skipDup:true, skipFormat:true, self:f.id});
  state.errors = e;
  if (Object.keys(e).length){ render(); return; }
  const a = acct(state.editing);
  Object.assign(a, {name:f.name, email:f.email, tel:f.tel, role:f.role,
    all: f.role==="hq" ? !!f.all : false,
    branches: (f.role==="hq" && f.all) ? [] : (f.branches||[]),
    status:f.status});
  state.view="list"; render(); toast("변경 사항을 저장했습니다.");
}
function doResetPw(){
  const pw = genPw();
  const a = acct(state.editing);
  if (a){ a.pw = pw; a.temp = true; }
  state.dialog = {kind:"temppw", pw, after:"stay"};
  render();
}
function openRequest(rid){
  const r = state.requests.find(x=>x.rid===rid); if (!r) return;
  state.editing = rid;
  state.form = {...r, role:"owner", all:false, branches: BRANCHES.some(b=>b.name===r.store) ? [r.store] : []};
  state.errors={}; state.branchOpen=false; state.view="pendingDetail"; render();
}
function doApprove(){
  const f = state.form, e = {};
  if (!(f.branches||[]).length && !(f.role==="hq" && f.all)) e.branches = "관리지점을 지정해주세요.";
  state.errors = e;
  if (Object.keys(e).length){ render(); return; }
  const pw = genPw();
  state.accounts.unshift({
    id:f.id, name:f.name, email:f.email, tel:f.tel, role:f.role,
    all: f.role==="hq" ? !!f.all : false, branches:f.branches||[],
    status:"active", created:today(), pw, temp:true,
  });
  state.requests = state.requests.filter(x=>x.rid!==state.editing);
  state.dialog = {kind:"temppw", pw, after:"list", msg:"승인했습니다. 임시 비밀번호를 신청자에게 직접 전달하세요."};
  render();
}
function doReject(){
  state.requests = state.requests.filter(x=>x.rid!==state.editing);
  state.view="pending"; render();
  toast("반려했습니다. 신청자에게는 통보되지 않으니 직접 알려주세요.");
}
function openMe(){
  const a = state.session;
  state.form = {...a, branches:[...a.branches]};
  state.errors={}; state.view="me"; render();
}
function doSaveMe(){
  const f = state.form, e = {};
  if (!f.name) e.name = "이름을 입력해주세요.";
  if (!f.email) e.email = "이메일을 입력해주세요.";
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email = "이메일 형식이 올바르지 않습니다.";
  else if (state.accounts.some(x=>x.email===f.email && x.id!==f.id)) e.email = "이미 쓰이고 있는 이메일입니다.";
  if (!f.tel) e.tel = "연락처를 입력해주세요.";
  state.errors = e;
  if (Object.keys(e).length){ render(); return; }
  Object.assign(state.session, {name:f.name, email:f.email, tel:f.tel});
  render(); toast("내 정보를 저장했습니다.");
}
function doSaveMePw(){
  const f = state.form, e = {};
  if (f.cur !== state.session.pw) e.cur = "현재 비밀번호가 맞지 않습니다.";
  const msg = validatePw(f.pw, f.pw2, state.session.id);
  if (msg) e.pw = msg;
  else if (f.pw === state.session.pw) e.pw = "현재 비밀번호와 같은 값은 쓸 수 없습니다.";
  else if (f.pw !== f.pw2) e.pw2 = "두 값이 다릅니다.";
  state.errors = e;
  if (Object.keys(e).length){ render(); return; }
  state.session.pw = f.pw; state.session.temp = false;
  state.view="me"; state.form={...state.session, branches:[...state.session.branches]};
  render(); toast("비밀번호를 변경했습니다.");
}

render();
</script>
</body>
</html>
