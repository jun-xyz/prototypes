<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인·설정 프로토타입 · BarisON</title>
<style>
:root{
  --bg:#F9FAFA; --surface:#FFFFFF; --surface-sub:#F9FAFB;
  --border:#E5E8EB; --border-strong:#D5D9DF; --border-input:#DCE0E5;
  --text:#17191C; --text-sub:#4E5968; --text-muted:#787E87; --text-placeholder:#AEB2B8;
  --primary:#338BFF; --primary-hover:#1B6FDE; --primary-weak:#EBF3FF;
  --danger:#F04452; --danger-weak:#FDECEE;
  --success:#12B76A;
  --chip:#F2F4F6; --thead:#F7F8FA;
  --radius-card:16px; --radius-input:8px; --radius-btn:8px;
  --shadow-card:0 1px 2px rgba(0,0,0,.04);
  --shadow-pop:0 6px 24px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px;color:var(--text)}
input:focus{outline:none}
::placeholder{color:var(--text-placeholder)}
a{color:var(--primary);text-decoration:none}

/* ---------- shell ---------- */
#app{min-height:100vh}
.shell{display:flex;min-height:100vh;min-width:1280px}
.sidebar{width:250px;flex:0 0 250px;background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.side-logo{height:90px;display:flex;align-items:center;padding:0 24px;font-size:24px;letter-spacing:-.6px;flex:0 0 auto}
.side-logo b{font-weight:800}
.side-logo i{font-style:italic;font-weight:500}
.side-body{flex:1 1 auto}
.side-foot{flex:0 0 auto;padding-bottom:16px}
.side-sec{padding:16px 24px 6px;font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.2px}
.side-item{display:block;width:100%;text-align:left;padding:12px 24px;font-size:14px;color:var(--text-sub);
  border-left:3px solid transparent}
.side-item:hover{background:var(--surface-sub)}
.side-item.on{background:var(--primary-weak);color:var(--primary);font-weight:600;border-left-color:var(--primary)}
.side-item.dim{color:var(--text-placeholder);cursor:default}
.side-item.dim:hover{background:none}

.body-col{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.topbar{height:90px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--surface);
  border-bottom:1px solid var(--border)}
.topbar .sel{height:38px;min-width:220px;border:1px solid var(--border-input);border-radius:var(--radius-input);
  display:flex;align-items:center;padding:0 12px;color:var(--text-sub);font-size:14px;background:var(--surface)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.badge{height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;color:#fff}
.badge.super{background:#F0483E}
.badge.owner{background:#5B6472}
.topbar .who{font-size:14px;color:var(--text-sub)}
.topbar .app-btn{height:38px;padding:0 14px;border:1px solid var(--primary);color:var(--primary);border-radius:var(--radius-btn);font-size:14px}
.main{flex:1 1 auto;padding:40px 24px 24px}
.footer{flex:0 0 auto;height:60px;display:flex;align-items:center;padding:0 24px;color:var(--text-muted);font-size:13px;background:var(--surface-sub)}
.page-title{font-size:24px;font-weight:600;margin-bottom:24px;display:flex;align-items:center;gap:14px}
.page-title .tab{font-size:24px;font-weight:600;color:var(--text-placeholder);cursor:pointer}
.page-title .tab.on{color:var(--text)}
.card{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:40px;max-width:1142px}
.card.narrow{max-width:544px;padding:32px}

.empty{padding:60px 0;text-align:center;color:var(--text-muted)}

/* ---------- form ---------- */
.body-title{font-size:18px;font-weight:600;margin:0 0 16px}
.body-title + .body-title,.group + .body-title{margin-top:32px}
.group{display:flex;flex-direction:column;gap:16px}
.field{max-width:480px}
.field.wide{max-width:660px}
.label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.label .req{color:var(--danger);margin-left:2px}
.input{width:100%;height:36px;border:1px solid var(--border-input);border-radius:var(--radius-input);padding:0 12px;background:var(--surface)}
.input:disabled{background:var(--surface-sub);color:var(--text-muted)}
.input.err{border-color:var(--danger)}
.help{font-size:12px;color:var(--text-muted);margin-top:6px}
.help.err{color:var(--danger)}
.row-inline{display:flex;gap:8px;align-items:center;max-width:660px}
.row-inline .input{max-width:480px}
.radios{display:flex;gap:20px;align-items:center;height:24px}
.radio{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--text-sub)}
.radio input{accent-color:var(--primary);width:16px;height:16px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:32px}
.btn{height:48px;padding:0 20px;border-radius:var(--radius-btn);font-size:15px;font-weight:600}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--chip);color:var(--text-sub)}
.btn.danger{background:var(--danger-weak);color:var(--danger)}
.btn.m{height:38px;padding:0 14px;font-size:14px;font-weight:500}
.btn.weak{background:var(--primary-weak);color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- auth screens ---------- */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0;gap:14px}
.auth .card{width:544px;max-width:544px;padding:32px}
.auth-logo{text-align:center;font-size:24px;letter-spacing:-.6px;margin-bottom:8px}
.auth-logo b{font-weight:800}
.auth-logo i{font-style:italic;font-weight:500}
.auth-sub{text-align:center;font-size:14px;color:var(--text-muted);margin-bottom:24px;white-space:pre-line}
.auth .field{max-width:480px;margin:0 auto}
.auth .group .field{margin:0;width:100%;max-width:none}
.auth .btn{width:100%;max-width:480px;display:block;margin:20px auto 0}
.auth-foot{text-align:center;font-size:13px;color:var(--text-muted);margin-top:14px}
.auth-msg{max-width:480px;margin:14px auto 0;padding:10px 12px;border-radius:var(--radius-input);font-size:13px}
.auth-msg.err{background:var(--danger-weak);color:var(--danger)}
.auth-msg.wait{background:var(--primary-weak);color:var(--primary)}
.done{text-align:center;padding:20px 0}
.done h3{font-size:20px;font-weight:600;margin-bottom:10px}
.done p{color:var(--text-muted);margin-bottom:24px}
.demo-note{width:544px;font-size:12px;color:var(--text-muted);background:#fff;border:1px dashed var(--border-strong);
  border-radius:10px;padding:12px 14px;line-height:1.7}
.demo-note b{color:var(--text-sub)}

/* ---------- toast / dialog ---------- */
.toast{position:fixed;top:150px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;
  padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow-pop)}
.toast.err{background:var(--danger)}
.dim-layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.dialog{width:424px;background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-pop);
  padding:24px;text-align:center}
.dialog h4{font-size:18px;font-weight:600;margin-bottom:8px}
.dialog p{font-size:14px;color:var(--text-muted);margin-bottom:20px;word-break:break-all}
.dialog .btns{display:flex;gap:8px}
.dialog .btns .btn{flex:1;height:48px}

/* ---------- settings ---------- */
.topbar .sel-branch{height:38px;min-width:220px;border:1px solid var(--border-input);border-radius:var(--radius-input);
  padding:0 10px;color:var(--text-sub);background:var(--surface)}
.topbar .icon-btn{width:38px;height:38px;border:1px solid var(--border-input);border-radius:var(--radius-btn);
  display:inline-flex;align-items:center;justify-content:center;color:var(--text-sub)}
.topbar .icon-btn.on{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}
.sec-head{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.sec-head .body-title{margin:0}
.sec-head .sub{font-size:13px;color:var(--text-muted)}
.sec-head .btn{margin-left:auto}
.sec + .sec{margin-top:40px;padding-top:32px;border-top:1px solid var(--border)}
.ro{min-height:36px;display:flex;align-items:center;padding:6px 12px;border-radius:var(--radius-input);
  background:var(--surface-sub);color:var(--text-sub);flex-wrap:wrap;gap:6px}
.ro .chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;background:var(--chip);border-radius:6px;font-size:13px}
.ext:after{content:" \2197";font-size:12px}

/* ---------- 통합계정관리 흉내 화면 (새 탭) ---------- */
.rg{min-height:100vh;background:#F3F4F6}
.rg-stub{background:#FFF7E6;color:#8A5A00;font-size:12px;padding:8px 24px;border-bottom:1px solid #F3DDAE}
.rg-head{height:56px;background:#1F2937;color:#fff;display:flex;align-items:center;padding:0 24px;gap:16px}
.rg-head .brand{font-weight:700}
.rg-head a{color:#fff;margin-left:auto;text-decoration:underline}
.rg-head button{color:#D1D5DB;font-size:13px}
.rg-body{display:flex}
.rg-nav{width:180px;padding:16px 0;background:#fff;min-height:calc(100vh - 90px);border-right:1px solid #E5E7EB}
.rg-nav span{display:block;padding:10px 20px;color:#374151;font-size:14px}
.rg-main{flex:1;padding:24px}
.rg-card{background:#fff;border-radius:8px;padding:24px;max-width:520px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.rg-main h1,.rg-card h1{font-size:20px;margin-bottom:16px}
.rg-card label{display:block;font-size:13px;color:#374151;margin:12px 0 4px}
.rg-card input{width:100%;height:36px;border:1px solid #D1D5DB;border-radius:6px;padding:0 10px}
.rg-card input:disabled{background:#F9FAFB;color:#9CA3AF}
.rg-card .rg-btn{margin-top:16px;height:38px;padding:0 16px;border-radius:6px;background:#2563EB;color:#fff;font-size:14px}
.rg-card .rg-err{color:#DC2626;font-size:13px;margin-top:8px}
.rg-card .rg-ok{color:#059669;font-size:13px;margin-top:8px}
.rg-login{display:flex;justify-content:center;padding-top:80px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   BarisON 로그인·설정 프로토타입 — 2026-09-17 범위
   · 계정 등록·승인·비밀번호는 통합계정관리가 맡는다
   · 바리스온에 남는 것: 로그인(회원가입은 새 탭) · 설정(내 정보 조회 + 지점 정보)
   · 통합계정관리 화면은 이 파일 안의 흉내 화면으로 새 탭에 띄운다 (?rg=signup / ?rg=detail)
   ============================================================ */

const BRANCHES = [
  {code:"BB001", name:"서울시청"},
  {code:"BB005", name:"시대인재 1호점"},
  {code:"BB006", name:"시대인재 2호점"},
  {code:"BB007", name:"시대인재 3호점"},
  {code:"BB008", name:"시대인재 4호점"},
  {code:"BB009", name:"시대인재 5호점"},
  {code:"BB016", name:"서울갤러리"},
  {code:null, name:"성수"},
  {code:null, name:"강남대로점"},
  {code:null, name:"현대자동차점"},
  {code:null, name:"덕구온천호텔앤콘도"},
  {code:null, name:"라운지와이"},
];
const bLabel = n => { const b = BRANCHES.find(x=>x.name===n); return b && b.code ? b.code+" "+b.name : n; };

const MENUS = [
  {sec:"", items:[{k:"home", n:"홈", hq:true}]},
  {sec:"로봇관리", items:[{k:"ops", n:"운영관리"},{k:"device", n:"기기상태관리"}]},
  {sec:"매장관리", items:[{k:"stock", n:"재고관리"},{k:"product", n:"판매상품관리"},{k:"kiosk", n:"키오스크설정"},{k:"did", n:"DID관리"},{k:"pay", n:"결제관리"}]},
  {sec:"매출관리/분석", items:[{k:"cal", n:"매출달력"},{k:"sales", n:"매출분석"},{k:"biz", n:"영업분석"},{k:"item", n:"상품분석"}]},
];

/* 통합계정관리에 있는 계정이라고 본다 — approved:false 는 가입 신청만 하고 승인 전 */
const ACCOUNTS = [
  {id:"hqops", name:"로봇운영관리팀", email:"hqops@example.com", tel:"010-1000-0001", role:"hq", all:true, branches:[], active:true, approved:true, pw:"baris1234!"},
  {id:"hqstaff2", name:"홍OO", email:"hqstaff2@example.com", tel:"010-1000-0005", role:"hq", all:false, branches:["성수","강남대로점"], active:false, approved:true, pw:"baris1234!"},
  {id:"store01", name:"서울갤러리", email:"store01@example.com", tel:"010-2000-0001", role:"owner", all:false, branches:["서울갤러리"], active:true, approved:true, pw:"baris1234!"},
  {id:"store02", name:"시대인재", email:"store02@example.com", tel:"010-2345-6789", role:"owner", all:false, branches:["시대인재 1호점","시대인재 2호점","시대인재 3호점","시대인재 4호점","시대인재 5호점"], active:true, approved:true, pw:"baris1234!"},
  {id:"newshop01", name:"김OO", email:"newshop01@example.com", tel:"010-1234-5678", role:"owner", all:false, branches:[], active:true, approved:false, pw:"baris1234!"},
];
const acct = id => ACCOUNTS.find(a=>a.id===id);

/* 지점 정보 — 계정이 아니라 지점에 저장된다 */
const BRANCH_INFO = {
  "서울시청": {mgr:"로봇운영관리팀", tel:"010-1000-0001", cs:"1588-0000"},
  "서울갤러리": {mgr:"서울갤러리", tel:"010-2000-0001", cs:"02-000-0016"},
  "시대인재 1호점": {mgr:"시대인재", tel:"010-2345-6789", cs:"02-000-0005"},
  "시대인재 2호점": {mgr:"시대인재", tel:"010-2345-6789", cs:"02-000-0006"},
};
const info = b => BRANCH_INFO[b] || (BRANCH_INFO[b] = {mgr:"", tel:"", cs:""});

const RG_PAGE = new URLSearchParams(location.search).get("rg");

const state = {
  view: "login",        // login · home · settings
  session: null,
  branch: null,
  greet: "",
  loginId: "", loginPw: "",
  loginErr: false,
  loggingIn: false,
  form: {},
  toast: null,
};

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const roleName = r => r==="hq" ? "본사 관리자" : "매장 점주";
const toast = (msg, kind) => { state.toast = {msg, kind:kind||""}; render(); setTimeout(()=>{ state.toast=null; render(); }, 2600); };
const myBranches = s => s.all ? BRANCHES.map(b=>b.name) : s.branches;
function formatTel(v){
  const d = v.replace(/\D/g,"");
  let out;
  if (d.startsWith("02")) out = d.length<=2?d : d.length<=5?d.slice(0,2)+"-"+d.slice(2) : d.length<=9?d.slice(0,2)+"-"+d.slice(2,d.length-4)+"-"+d.slice(-4) : d.slice(0,2)+"-"+d.slice(2,6)+"-"+d.slice(6,10);
  else out = d.length<=3?d : d.length<=7?d.slice(0,3)+"-"+d.slice(3) : d.length<=10?d.slice(0,3)+"-"+d.slice(3,d.length-4)+"-"+d.slice(-4) : d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7,11);
  return out.slice(0,13);
}
function openRangers(page, id){
  const u = location.pathname + "?rg=" + page + (id ? "&memberId=" + encodeURIComponent(id) : "");
  window.open(u, "_blank");
}

/* ============================================================
   RENDER — 바리스온
   ============================================================ */
function render(){
  if (RG_PAGE) { renderRangers(); return; }
  const app = document.getElementById("app");
  let html = state.view==="login" ? renderLogin() : renderShell();
  if (state.toast) html += `<div class="toast ${state.toast.kind}">${esc(state.toast.msg)}</div>`;
  app.innerHTML = html;
}

function renderLogin(){
  const err = state.loginErr;
  return `
  <div class="auth">
    <div class="card">
      <div class="auth-logo"><b>Baris</b><i>brew</i></div>
      <div class="auth-sub">관리자 계정으로 로그인하세요.</div>
      <div class="field"><div class="label">아이디</div>
        <input class="input ${err?"err":""}" data-field="loginId" value="${esc(state.loginId)}" placeholder="아이디 입력"></div>
      <div class="field" style="margin-top:14px"><div class="label">비밀번호</div>
        <input class="input ${err?"err":""}" type="password" data-field="loginPw" value="${esc(state.loginPw)}" placeholder="비밀번호 입력"></div>
      ${err ? `<div class="auth-msg err">아이디 또는 비밀번호가 올바르지 않습니다.</div>` : ""}
      <button class="btn primary" data-action="login" ${state.loggingIn?"disabled":""}>${state.loggingIn?"로그인 중…":"로그인"}</button>
      <div class="auth-foot">계정이 없으신가요? <a href="#" class="ext" data-action="signup">회원가입</a></div>
    </div>
    <div class="demo-note">
      <b>프로토타입 안내</b> — 실제 화면에는 없는 설명입니다.<br>
      비밀번호는 모두 <b>baris1234!</b> 입니다.
      본사 관리자 <b>hqops</b> · 매장 점주 <b>store01</b> · 여러 지점 점주 <b>store02</b> · 승인 전 <b>newshop01</b> · 사용 중지 <b>hqstaff2</b><br>
      승인 전·사용 중지 계정도 틀린 입력과 같은 안내를 봅니다.
      「회원가입」과 설정의 「비밀번호 변경」은 새 탭에 <b>통합계정관리 흉내 화면</b>을 띄웁니다. 실제 시스템과 연결되지 않습니다.<br>
      비밀번호 변경 탭은 지금 통합계정관리처럼 <b>로그인 → 홈 → 위쪽 이름 → 회원 상세</b> 순서로 가야 합니다.
    </div>
  </div>`;
}

function renderShell(){
  const s = state.session;
  const isHq = s.role==="hq";
  const landing = isHq ? "home" : "ops";
  let side = "";
  for (const grp of MENUS){
    const items = grp.items.filter(it=>!it.hq || isHq);
    if (!items.length) continue;
    if (grp.sec) side += `<div class="side-sec">${esc(grp.sec)}</div>`;
    side += items.map(it=>{
      const on = state.view==="home" && it.k===landing;
      return `<button class="side-item ${on?"on":"dim"}" ${it.k===landing?'data-action="go-home"':""}>${esc(it.n)}</button>`;
    }).join("");
  }
  const opts = myBranches(s).map(b=>`<option value="${esc(b)}" ${b===state.branch?"selected":""}>${esc(bLabel(b))}</option>`).join("");
  return `
  <div class="shell">
    <aside class="sidebar">
      <div class="side-logo"><b>Baris</b><i>brew</i></div>
      <div class="side-body">${side}</div>
    </aside>
    <div class="body-col">
      <header class="topbar">
        <select class="sel-branch" data-field="branch">${opts}</select>
        <div class="right">
          <span class="badge ${isHq?"super":"owner"}">${isHq?"Super Admin":"Owner"}</span>
          <span class="who">${esc(state.greet)}님 반가워요</span>
          <button class="icon-btn ${state.view==="settings"?"on":""}" data-action="go-settings" title="설정" aria-label="설정">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button class="app-btn" data-action="logout">로그아웃</button>
        </div>
      </header>
      <main class="main">${state.view==="settings" ? viewSettings() : viewHome()}</main>
      <footer class="footer">2026 © XYZ corp.</footer>
    </div>
  </div>`;
}

function viewHome(){
  const where = state.session.role==="hq" ? "홈" : "운영관리";
  return `<div class="card"><div class="empty">로그인하면 ${where} 화면으로 들어옵니다 — 이 프로토타입은 그 화면을 그리지 않습니다.<br>우상단 톱니 아이콘으로 「설정」을 열어보세요.</div></div>`;
}

function roRow(label, valueHtml){
  return `<div class="field"><div class="label">${esc(label)}</div><div class="ro">${valueHtml}</div></div>`;
}

function viewSettings(){
  const s = state.session, f = state.form;
  const branchesHtml = s.all ? "전 지점" : s.branches.map(b=>`<span class="chip">${esc(bLabel(b))}</span>`).join("");
  return `
  <div class="page-title">설정</div>
  <div class="card">
    <div class="sec">
      <div class="sec-head">
        <div class="body-title">내 정보</div>
        <button class="btn m ghost ext" data-action="change-pw">비밀번호 변경</button>
      </div>
      <div class="group">
        ${roRow("아이디", esc(s.id))}
        ${roRow("이름", esc(s.name))}
        ${roRow("이메일", esc(s.email))}
        ${roRow("연락처", esc(s.tel))}
        ${roRow("역할", esc(roleName(s.role)))}
        ${roRow("관리지점", branchesHtml)}
      </div>
    </div>
    <div class="sec">
      <div class="sec-head">
        <div class="body-title">지점 정보</div>
        <span class="sub">${esc(bLabel(state.branch))}</span>
      </div>
      <div class="group">
        <div class="field"><div class="label">관리자 이름</div>
          <input class="input" data-field="mgr" value="${esc(f.mgr)}" placeholder="관리자 이름을 입력하세요"></div>
        <div class="field"><div class="label">관리자 연락처</div>
          <input class="input" data-field="tel" value="${esc(f.tel)}" placeholder="관리자 연락처를 입력하세요" maxlength="13" inputmode="numeric"></div>
        <div class="field"><div class="label">고객센터</div>
          <input class="input" data-field="cs" value="${esc(f.cs)}" placeholder="고객센터를 입력하세요" maxlength="13"></div>
      </div>
      <div class="actions">
        <button class="btn primary" data-action="save-branch">저장하기</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   EVENTS — 바리스온
   ============================================================ */
const app = document.getElementById("app");

app.addEventListener("input", ev=>{
  if (RG_PAGE) return;
  const el = ev.target.closest("[data-field]");
  if (!el) return;
  const k = el.dataset.field;
  if (k==="loginId" || k==="loginPw"){ state[k] = el.value; return; }
  if (k==="tel"){
    el.value = formatTel(el.value);
    state.form.tel = el.value;
    if (document.activeElement===el) el.setSelectionRange(el.value.length, el.value.length);
    return;
  }
  state.form[k] = el.value;
});

app.addEventListener("change", ev=>{
  if (RG_PAGE) return;
  const el = ev.target.closest("[data-field]");
  if (el && el.dataset.field==="branch"){ state.branch = el.value; loadBranchForm(); render(); }
});

app.addEventListener("keydown", ev=>{
  if (RG_PAGE || state.view!=="login" || ev.key!=="Enter") return;
  if (ev.target.closest("[data-field]")) doLogin();
});

app.addEventListener("click", ev=>{
  if (RG_PAGE) return;
  const t = ev.target.closest("[data-action]");
  if (!t) return;
  if (t.tagName === "A") ev.preventDefault();
  switch(t.dataset.action){
    case "login": doLogin(); break;
    case "signup": openRangers("signup"); break;
    case "logout": state.session=null; state.view="login"; state.loginId=""; state.loginPw=""; state.loginErr=false; render(); break;
    case "go-home": state.view="home"; render(); break;
    case "go-settings": state.view="settings"; loadBranchForm(); render(); break;
    case "change-pw": openRangers("detail", state.session.id); break;
    case "save-branch": doSaveBranch(); break;
  }
});

function doLogin(){
  if (state.loggingIn) return;
  state.loggingIn = true; state.loginErr = false; render();
  setTimeout(()=>{
    state.loggingIn = false;
    const a = acct(state.loginId.trim());
    // 틀린 입력·승인 전·사용 중지 모두 같은 안내 (2026-09-17 결정)
    if (!a || a.pw!==state.loginPw || !a.approved || !a.active){ state.loginErr = true; render(); return; }
    state.session = a;
    state.branch = myBranches(a)[0];
    state.greet = info(state.branch).mgr || a.name;
    state.view = "home";
    render();
  }, 600);
}
function loadBranchForm(){
  const i = info(state.branch);
  state.form = {mgr:i.mgr, tel:i.tel, cs:i.cs};
}
function doSaveBranch(){
  Object.assign(info(state.branch), {mgr:state.form.mgr||"", tel:state.form.tel||"", cs:state.form.cs||""});
  toast("저장되었습니다.");
}

/* ============================================================
   통합계정관리 흉내 화면 (새 탭)
   로그인 기록을 탭마다 따로 두는 실제 동작을 따라, 새 탭은 늘 로그인부터 시작하고
   로그인 뒤에는 원래 가려던 화면이 아니라 홈으로 간다.
   ============================================================ */
const rg = { page: RG_PAGE==="signup" ? "signup" : "login", me: null, id:"", pw:"", err:"", pw1:"", pw2:"", msg:"", msgKind:"" };

function rgFrame(inner, withShell){
  const stub = `<div class="rg-stub">프로토타입용 흉내 화면입니다 — 실제 통합계정관리와 연결되지 않습니다.</div>`;
  if (!withShell) return `<div class="rg">${stub}${inner}</div>`;
  return `<div class="rg">${stub}
    <div class="rg-head"><span class="brand">통합계정관리시스템</span>
      <a href="#" data-rg="detail">${esc(rg.me.name)}</a>
      <button data-rg="logout">로그아웃</button></div>
    <div class="rg-body">
      <nav class="rg-nav"><span>홈</span><span>회원 목록</span></nav>
      <main class="rg-main">${inner}</main>
    </div></div>`;
}

function renderRangers(){
  document.title = "통합계정관리시스템 (흉내)";
  const el = document.getElementById("app");
  if (rg.page==="signup"){
    const f = ["아이디 *","구분 *","이름 *","비밀번호 *","비밀번호 확인 *","닉네임","휴대폰","이메일","홈페이지","주소","권한그룹"];
    el.innerHTML = rgFrame(`<div class="rg-login"><div class="rg-card"><h1>회원가입 신청</h1>
      ${f.map(l=>`<label>${esc(l)}</label><input disabled>`).join("")}
      <p class="rg-ok" style="color:#6B7280">실제 가입은 통합계정관리에서 합니다. 신청한 계정은 관리자가 승인한 뒤에 바리스온에 로그인할 수 있습니다.</p>
    </div></div>`, false);
    return;
  }
  if (rg.page==="login"){
    el.innerHTML = rgFrame(`<div class="rg-login"><div class="rg-card"><h1>통합계정관리시스템</h1>
      <label>아이디</label><input data-rgf="id" value="${esc(rg.id)}">
      <label>비밀번호</label><input type="password" data-rgf="pw" value="${esc(rg.pw)}">
      ${rg.err?`<div class="rg-err">${esc(rg.err)}</div>`:""}
      <button class="rg-btn" data-rg="login">로그인</button>
    </div></div>`, false);
    return;
  }
  if (rg.page==="home"){
    el.innerHTML = rgFrame(`<h1>홈</h1><div class="rg-card"><h1>${esc(rg.me.name)}님, 반갑습니다.</h1>
      <p style="color:#6b7280;font-size:14px">왼쪽 메뉴에서 회원 목록, 가입 승인, 권한그룹 관리 기능을 이용할 수 있습니다.</p></div>`, true);
    return;
  }
  if (rg.page==="detail"){
    const m = rg.me;
    el.innerHTML = rgFrame(`<h1>회원 상세</h1><div class="rg-card">
      <label>아이디</label><input disabled value="${esc(m.id)}">
      <label>이름</label><input disabled value="${esc(m.name)}">
      <label>이메일</label><input disabled value="${esc(m.email)}">
      <label>비밀번호 변경</label><input type="password" data-rgf="pw1" placeholder="변경할 때만 입력" value="${esc(rg.pw1)}">
      <label>비밀번호 확인</label><input type="password" data-rgf="pw2" placeholder="변경할 때만 입력" value="${esc(rg.pw2)}">
      ${rg.msg?`<div class="${rg.msgKind}">${esc(rg.msg)}</div>`:""}
      <button class="rg-btn" data-rg="save">기본 정보 저장</button>
    </div>`, true);
  }
}

if (RG_PAGE){
  app.addEventListener("input", ev=>{
    const f = ev.target.closest("[data-rgf]"); if (f) rg[f.dataset.rgf] = f.value;
  });
  app.addEventListener("click", ev=>{
    const t = ev.target.closest("[data-rg]"); if (!t) return;
    ev.preventDefault();
    const a = t.dataset.rg;
    if (a==="login"){
      const m = acct(rg.id.trim());
      if (!m || m.pw!==rg.pw || !m.approved){ rg.err = "로그인에 실패했습니다."; renderRangers(); return; }
      rg.me = m; rg.err = ""; rg.page = "home"; renderRangers(); return;
    }
    if (a==="logout"){ rg.me=null; rg.id=""; rg.pw=""; rg.page="login"; renderRangers(); return; }
    if (a==="detail"){ rg.page="detail"; rg.msg=""; renderRangers(); return; }
    if (a==="save"){
      if (rg.pw1 && rg.pw1!==rg.pw2){ rg.msg="비밀번호가 서로 일치하지 않습니다."; rg.msgKind="rg-err"; renderRangers(); return; }
      if (rg.pw1) rg.me.pw = rg.pw1;
      rg.pw1=""; rg.pw2=""; rg.msg="저장되었습니다."; rg.msgKind="rg-ok"; renderRangers();
    }
  });
}

render();
</script>
</body>
</html>
